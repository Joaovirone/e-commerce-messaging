
services:
  database: 
    image: 'postgres:15-alpine'
    container_name: 'database_mensageria'
    environment:
      - 'POSTGRES_DB=pedido_db'
      - 'POSTGRES_PASSWORD=root'
      - 'POSTGRES_USER=root'
    ports:
      - '5001:5432'
    volumes:
      - pgdata_pedido:/var/lib/postgresql/data
    restart: unless-stopped
    
  rabbitmq: 
    image: 'rabbitmq:3-management-alpine'
    container_name: broker_rabbitmq
    environment:
      - 'RABBITMQ_DEFAULT_USER=admin'    
      - 'RABBITMQ_DEFAULT_PASS=admin123' 
    ports:
      - '5002:5672'
      - '15002:15672' 
    restart: unless-stopped

  pedido-service:
    build: . 
    image: mensageria-pedido:v1
    container_name: app_pedido
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/pedido_db
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
    depends_on:
      - database 
      - rabbitmq

volumes:
  pgdata_pedido: